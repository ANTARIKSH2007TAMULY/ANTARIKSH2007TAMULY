<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Antariksh Tamuly system profile</title>
  <desc id="desc">A premium light technical dashboard with a portrait panel, animated grid, and system status console for Antariksh Tamuly.</desc>
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F9FF"/>
      <stop offset="0.5" stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F4F8FD"/>
    </linearGradient>
    <radialGradient id="haloLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(286 240) rotate(90) scale(270 270)">
      <stop offset="0" stop-color="#5EA7FF" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#6EA3FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F5F9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F9FF"/>
    </linearGradient>
    <linearGradient id="lineLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E7BE6"/>
      <stop offset="1" stop-color="#5B67E8"/>
    </linearGradient>
    <pattern id="gridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#DBE7F6" stroke-width="1" opacity="0.8"/>
    </pattern>
    <filter id="glowLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

