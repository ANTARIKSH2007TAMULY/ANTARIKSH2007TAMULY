<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Antariksh Tamuly system profile</title>
  <desc id="desc">A premium dark technical dashboard with a portrait panel, animated grid, and system status console for Antariksh Tamuly.</desc>
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060B13">
        <animate attributeName="stop-color" values="#060B13;#0B1320;#060B13;#101D2F;#060B13" dur="20s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.42" stop-color="#0A1220">
        <animate attributeName="stop-color" values="#0A1220;#121F2E;#0A1220;#15273E;#0A1220" dur="20s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0D1523">
        <animate attributeName="stop-color" values="#0D1523;#132238;#0D1523;#101E31;#0D1523" dur="20s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="haloDark" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(286 240) rotate(90) scale(270 270)">
      <stop offset="0" stop-color="#8AE6FF" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#5D7BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121F2D"/>
      <stop offset="1" stop-color="#0D1725"/>
    </linearGradient>
    <linearGradient id="lineDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DE5FF"/>
      <stop offset="1" stop-color="#7686FF"/>
    </linearGradient>
    <pattern id="gridDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" stroke="#163149" stroke-width="1" opacity="0.7"/>
    </pattern>
    <filter id="glowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

